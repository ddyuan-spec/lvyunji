<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="100%" height="100%" style="max-width:720px;">
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
    </marker>
    <marker id="arr-cancel" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e64340"/>
    </marker>
    <filter id="sh2" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="720" height="180" fill="#fafafa" rx="8"/>

  <text x="360" y="28" text-anchor="middle" fill="#333" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="bold">代付请求状态流转</text>

  <!-- State: pending -->
  <rect x="40" y="52" width="130" height="50" fill="#ff9800" rx="10" filter="url(#sh2)"/>
  <text x="105" y="72" text-anchor="middle" fill="#fff" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="bold">待确认</text>
  <text x="105" y="90" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11">订单账号发起代付</text>

  <line x1="170" y1="77" x2="235" y2="77" stroke="#666" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="203" y="68" text-anchor="middle" fill="#888" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10">支付账号点击</text>
  <text x="203" y="100" text-anchor="middle" fill="#888" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10">「立即代付」</text>

  <!-- State: paying -->
  <rect x="240" y="52" width="130" height="50" fill="#2196f3" rx="10" filter="url(#sh2)"/>
  <text x="305" y="72" text-anchor="middle" fill="#fff" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="bold">支付中</text>
  <text x="305" y="90" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11">70%电子+30%储值</text>

  <line x1="370" y1="77" x2="435" y2="77" stroke="#07c160" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="403" y="68" text-anchor="middle" fill="#07c160" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" font-weight="bold">支付成功</text>

  <!-- State: done -->
  <rect x="440" y="52" width="130" height="50" fill="#4caf50" rx="10" filter="url(#sh2)"/>
  <text x="505" y="72" text-anchor="middle" fill="#fff" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="bold">已完成</text>
  <text x="505" y="90" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11">双方订单同步</text>

  <!-- Cancel branch -->
  <line x1="105" y1="102" x2="105" y2="130" stroke="#e64340" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="105" y1="130" x2="165" y2="130" stroke="#e64340" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-cancel)"/>

  <rect x="170" y="115" width="100" height="32" fill="#ffebee" rx="8" stroke="#e64340" stroke-width="1"/>
  <text x="220" y="136" text-anchor="middle" fill="#e64340" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="bold">X 已取消</text>

  <text x="105" y="150" text-anchor="middle" fill="#e64340" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10">订单账号取消代付请求</text>
</svg>