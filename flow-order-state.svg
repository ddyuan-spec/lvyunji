<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="100%" height="100%" style="max-width:720px;">
  <defs>
    <marker id="arr3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
    </marker>
    <filter id="sh3" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="720" height="280" fill="#fafafa" rx="8"/>

  <text x="360" y="28" text-anchor="middle" fill="#333" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="bold">支付后订单状态流转</text>

  <!-- Order account section -->
  <rect x="20" y="48" width="140" height="28" fill="#e8f5e9" rx="6"/>
  <text x="90" y="67" text-anchor="middle" fill="#2e7d32" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="bold">订单账号</text>

  <rect x="30" y="88" width="144" height="56" fill="#2196f3" rx="10" filter="url(#sh3)"/>
  <text x="102" y="110" text-anchor="middle" fill="#fff" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" font-weight="bold">已支付·待发货</text>
  <text x="102" y="133" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10">可操作：查看、取消</text>

  <line x1="174" y1="116" x2="224" y2="116" stroke="#666" stroke-width="1.5" marker-end="url(#arr3)"/>
  <text x="199" y="108" text-anchor="middle" fill="#888" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9">商家发货</text>

  <rect x="229" y="88" width="144" height="56" fill="#ff9800" rx="10" filter="url(#sh3)"/>
  <text x="301" y="110" text-anchor="middle" fill="#fff" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" font-weight="bold">待收货</text>
  <text x="301" y="133" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10">可操作：确认收货</text>

  <line x1="373" y1="116" x2="423" y2="116" stroke="#07c160" stroke-width="2" marker-end="url(#arr3)"/>
  <text x="398" y="108" text-anchor="middle" fill="#07c160" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9" font-weight="bold">确认收货</text>

  <rect x="428" y="88" width="144" height="56" fill="#4caf50" rx="10" filter="url(#sh3)"/>
  <text x="500" y="110" text-anchor="middle" fill="#fff" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" font-weight="bold">已完成</text>
  <text x="500" y="133" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10">仅展示·无操作</text>

  <!-- Payer section -->
  <rect x="20" y="180" width="680" height="28" fill="#fff3e0" rx="6"/>
  <text x="360" y="199" text-anchor="middle" fill="#e65100" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="bold">支付账号（仅展示，无任何操作）</text>

  <rect x="160" y="220" width="400" height="44" fill="#f5f5f5" rx="10" filter="url(#sh3)" stroke="#ddd" stroke-width="1"/>
  <text x="360" y="240" text-anchor="middle" fill="#333" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" font-weight="bold">代付订单·已完成</text>
  <text x="360" y="258" text-anchor="middle" fill="#999" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11">标识「代付已完成」仅展示订单信息，无任何操作入口</text>
</svg>