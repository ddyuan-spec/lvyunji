<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>补水管理 - 绿韵家管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }

        /* 顶部导航 */
        .top-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: #2d2d3a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
        }
        .logo {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
        }
        .top-nav {
            display: flex;
            gap: 32px;
        }
        .top-nav-item {
            color: #a0a0b0;
            font-size: 14px;
            cursor: pointer;
            padding: 8px 0;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .top-nav-item:hover {
            color: #fff;
        }
        .top-nav-item.active {
            color: #ff4d7d;
            border-bottom-color: #ff4d7d;
        }
        .user-info {
            color: #fff;
            font-size: 14px;
        }

        /* 侧边栏 */
        .sidebar {
            position: fixed;
            top: 56px;
            left: 0;
            bottom: 0;
            width: 220px;
            background: #f8f8fa;
            border-right: 1px solid #e8e8e8;
            overflow-y: auto;
            padding: 16px 0;
        }
        .menu-group {
            margin-bottom: 8px;
        }
        .menu-title {
            padding: 10px 20px;
            color: #999;
            font-size: 12px;
            font-weight: 500;
        }
        .menu-item {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            color: #666;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .menu-item:hover {
            background: #f0f0f2;
            color: #333;
        }
        .menu-item.active {
            background: #fff5f7;
            color: #ff4d7d;
            border-left: 3px solid #ff4d7d;
            padding-left: 17px;
        }
        .menu-item .arrow {
            margin-left: auto;
            font-size: 12px;
            transition: transform 0.2s;
        }
        .menu-item.expanded .arrow {
            transform: rotate(90deg);
        }
        .sub-menu {
            display: none;
            background: #f2f2f4;
        }
        .sub-menu.show {
            display: block;
        }
        .sub-menu .menu-item {
            padding-left: 36px;
            font-size: 13px;
        }
        .sub-menu .menu-item.active {
            padding-left: 33px;
        }

        /* 主内容区 */
        .main-content {
            margin-left: 220px;
            margin-top: 56px;
            padding: 20px;
            min-height: calc(100vh - 56px);
        }

        /* 面包屑 */
        .breadcrumb {
            font-size: 13px;
            color: #999;
            margin-bottom: 16px;
        }
        .breadcrumb span {
            margin: 0 6px;
        }
        .breadcrumb a {
            color: #666;
            text-decoration: none;
        }
        .breadcrumb a:hover {
            color: #ff4d7d;
        }

        /* 页面标题 */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .page-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        /* 状态标签 */
        .status-tabs {
            display: flex;
            gap: 0;
            background: #fff;
            border-radius: 4px;
            margin-bottom: 16px;
            border-bottom: 1px solid #eee;
        }
        .status-tab {
            padding: 12px 24px;
            font-size: 14px;
            color: #666;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .status-tab:hover {
            color: #333;
        }
        .status-tab.active {
            color: #ff4d7d;
            border-bottom-color: #ff4d7d;
        }
        .status-tab .count {
            margin-left: 4px;
            font-size: 12px;
            color: #999;
        }

        /* 搜索栏 */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            background: #fff;
            padding: 16px;
            border-radius: 4px;
            margin-bottom: 16px;
        }
        .filter-input {
            width: 200px;
            height: 36px;
            padding: 0 12px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .filter-input:focus {
            border-color: #ff4d7d;
        }
        .filter-input::placeholder {
            color: #bbb;
        }
        .btn {
            height: 36px;
            padding: 0 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #ff4d7d;
            color: #fff;
        }
        .btn-primary:hover {
            background: #ff3366;
        }
        .btn-default {
            background: #fff;
            border: 1px solid #dcdfe6;
            color: #666;
        }
        .btn-default:hover {
            border-color: #ff4d7d;
            color: #ff4d7d;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 未审核总量栏 */
        .pending-summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            padding: 14px 16px;
            border-radius: 4px;
            margin-bottom: 16px;
            border-left: 4px solid #ff4d7d;
        }
        .pending-summary .summary-text {
            font-size: 14px;
            color: #666;
        }
        .pending-summary .summary-text .num {
            color: #ff4d7d;
            font-weight: 600;
            font-size: 18px;
            margin: 0 4px;
        }
        .pending-summary .summary-actions {
            display: flex;
            gap: 10px;
        }
        .btn-batch-approve {
            background: #fff;
            border: 1px solid #67c23a;
            color: #67c23a;
            height: 32px;
            padding: 0 16px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-batch-approve:hover {
            background: #67c23a;
            color: #fff;
        }
        .btn-batch-reject {
            background: #fff;
            border: 1px solid #f56c6c;
            color: #f56c6c;
            height: 32px;
            padding: 0 16px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-batch-reject:hover {
            background: #f56c6c;
            color: #fff;
        }

        /* 批量操作栏（勾选后显示） */
        .batch-actions {
            display: none;
            align-items: center;
            gap: 12px;
            background: #fff5f7;
            border: 1px solid #ffcdd3;
            padding: 12px 16px;
            border-radius: 4px;
            margin-bottom: 16px;
        }
        .batch-actions.show {
            display: flex;
        }
        .batch-actions .selected-count {
            color: #ff4d7d;
            font-weight: 500;
        }

        /* 表格 */
        .table-container {
            background: #fff;
            border-radius: 4px;
            overflow: hidden;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }
        .data-table th,
        .data-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        .data-table th {
            background: #fafafa;
            color: #666;
            font-weight: 500;
        }
        .data-table tr:hover {
            background: #fafafa;
        }
        .data-table .checkbox {
            width: 40px;
            text-align: center;
        }
        .data-table .checkbox input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #ff4d7d;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
        }
        .status-pending {
            background: #fff7e6;
            color: #fa8c16;
        }
        .status-approved {
            background: #f6ffed;
            color: #52c41a;
        }
        .status-rejected {
            background: #fff1f0;
            color: #f5222d;
        }
        .action-link {
            color: #ff4d7d;
            cursor: pointer;
            font-size: 14px;
        }
        .action-link:hover {
            text-decoration: underline;
        }

        /* 分页 */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 16px;
            gap: 8px;
        }
        .pagination-info {
            color: #999;
            font-size: 13px;
            margin-right: 16px;
        }
        .pagination-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            background: #fff;
            color: #666;
            cursor: pointer;
            font-size: 13px;
        }
        .pagination-btn:hover {
            border-color: #ff4d7d;
            color: #ff4d7d;
        }
        .pagination-btn.active {
            background: #ff4d7d;
            border-color: #ff4d7d;
            color: #fff;
        }

        /* 弹窗遮罩 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show {
            display: flex;
        }

        /* 弹窗 */
        .modal {
            background: #fff;
            border-radius: 8px;
            width: 440px;
            max-width: 90%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
        }
        .modal-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }
        .modal-close {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #999;
            font-size: 20px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .modal-close:hover {
            background: #f5f5f5;
            color: #666;
        }
        .modal-body {
            padding: 20px;
        }
        .modal-body p {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }
        .modal-body .highlight {
            color: #ff4d7d;
            font-weight: 500;
        }
        .modal-body .remark-label {
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
            display: block;
            margin-top: 16px;
        }
        .modal-body .remark-input {
            width: 100%;
            height: 80px;
            padding: 10px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 14px;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }
        .modal-body .remark-input:focus {
            border-color: #ff4d7d;
        }
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding: 16px 20px;
            border-top: 1px solid #eee;
        }

        /* Toast提示 */
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 12px 24px;
            border-radius: 4px;
            font-size: 14px;
            z-index: 3000;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .toast.show {
            opacity: 1;
        }
        .toast.success {
            background: #52c41a;
        }
        .toast.error {
            background: #f5222d;
        }
    </style>
</head>

        let filteredData = [];
        let auditTargetIds = []; // 当前审核的目标ID列表
        let auditMode = ''; // 'single' | 'selected' | 'all'

        // ========== 初始化 ==========
        function init() {
            filterAndRender();
        }

        // ========== 筛选 & 渲染 ==========
        function filterAndRender() {
            const nameVal = document.getElementById('filterName').value.trim().toLowerCase();
            const accountVal = document.getElementById('filterAccount').value.trim().toLowerCase();
            const phoneVal = document.getElementById('filterPhone').value.trim().toLowerCase();

            filteredData = allData.filter(item => {
                // 状态筛选
                if (currentTab !== 'all' && item.status !== currentTab) return false;
                // 搜索条件
                if (nameVal && !item.name.toLowerCase().includes(nameVal)) return false;
                if (accountVal && !item.account.toLowerCase().includes(accountVal)) return false;
                if (phoneVal && !item.contact.toLowerCase().includes(phoneVal)) return false;
                return true;
            });

            renderTable();
            updateCounts();
            updatePendingSummary();
            cancelSelect();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            if (filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;color:#999;padding:40px;">暂无数据</td></tr>';
                return;
            }
            tbody.innerHTML = filteredData.map(item => {
                const statusMap = { pending: '待审核', approved: '已通过', rejected: '已驳回' };
                const statusClass = { pending: 'status-pending', approved: 'status-approved', rejected: 'status-rejected' };
                const isPending = item.status === 'pending';
                const actionHtml = isPending
                    ? '<span class="action-link" onclick="openSingleAudit(' + item.id + ')">审核</span>'
                    : '--';
                return '<tr data-id="' + item.id + '" data-status="' + item.status + '">' +
                    '<td class="checkbox"><input type="checkbox" class="row-checkbox" ' + (isPending ? '' : 'disabled') + '></td>' +
                    '<td><div>' + item.name + '</div><div style="color:#999;font-size:12px;">' + item.contact + '</div></td>' +
                    '<td>' + item.account + '</td>' +
                    '<td>' + item.yqId + '</td>' +
                    '<td>' + item.qty + '</td>' +
                    '<td><span class="status-badge ' + statusClass[item.status] + '">' + statusMap[item.status] + '</span></td>' +
                    '<td>' + item.applyTime + '</td>' +
                    '<td>' + item.auditTime + '</td>' +
                    '<td>' + item.operator + '</td>' +
                    '<td>' + item.remark + '</td>' +
                    '<td>' + actionHtml + '</td>' +
                    '</tr>';
            }).join('');

            // 重新绑定复选框事件
            document.querySelectorAll('.row-checkbox:not([disabled])').forEach(cb => {
                cb.addEventListener('change', updateBatchActions);
            });
            document.getElementById('selectAll').addEventListener('change', handleSelectAll);
            document.getElementById('selectAll').checked = false;
            document.getElementById('selectAll').indeterminate = false;

            document.getElementById('paginationInfo').textContent = '共 ' + filteredData.length + ' 条';
        }

        function updateCounts() {
            const pending = allData.filter(i => i.status === 'pending').length;
            const approved = allData.filter(i => i.status === 'approved').length;
            const rejected = allData.filter(i => i.status === 'rejected').length;
            document.getElementById('countAll').textContent = '(' + allData.length + ')';
            document.getElementById('countPending').textContent = '(' + pending + ')';
            document.getElementById('countApproved').textContent = '(' + approved + ')';
            document.getElementById('countRejected').textContent = '(' + rejected + ')';
        }

        function updatePendingSummary() {
            const pendingInFiltered = filteredData.filter(i => i.status === 'pending');
            document.getElementById('pendingTotal').textContent = pendingInFiltered.length;
            const summary = document.getElementById('pendingSummary');
            if (pendingInFiltered.length === 0) {
                summary.style.display = 'none';
            } else {
                summary.style.display = 'flex';
            }
        }

        // ========== 搜索 & 重置 ==========
        function doSearch() {
            filterAndRender();
        }
        function doReset() {
            document.getElementById('filterName').value = '';
            document.getElementById('filterAccount').value = '';
            document.getElementById('filterPhone').value = '';
            filterAndRender();
        }

        // ========== 状态标签切换 ==========
        document.querySelectorAll('.status-tab').forEach(tab => {
            tab.addEventListener('click', function () {
                document.querySelectorAll('.status-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentTab = this.dataset.status;
                filterAndRender();
            });
        });

        // ========== 全选 ==========
        function handleSelectAll() {
            const checked = document.getElementById('selectAll').checked;
            document.querySelectorAll('.row-checkbox:not([disabled])').forEach(cb => {
                cb.checked = checked;
            });
            updateBatchActions();
        }

        // ========== 勾选批量操作栏 ==========
        function updateBatchActions() {
            const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
            const count = checkedBoxes.length;
            document.getElementById('selectedCount').textContent = count;
            const batchActions = document.getElementById('batchActions');
            if (count > 0) {
                batchActions.classList.add('show');
            } else {
                batchActions.classList.remove('show');
            }
            // 全选状态
            const allEnabled = document.querySelectorAll('.row-checkbox:not([disabled])');
            const selectAll = document.getElementById('selectAll');
            selectAll.checked = count > 0 && count === allEnabled.length;
            selectAll.indeterminate = count > 0 && count < allEnabled.length;
        }

        function cancelSelect() {
            document.querySelectorAll('.row-checkbox').forEach(cb => { cb.checked = false; });
            document.getElementById('selectAll').checked = false;
            document.getElementById('selectAll').indeterminate = false;
            document.getElementById('batchActions').classList.remove('show');
        }

        // ========== 打开审核弹窗 ==========
        // 单条审核
        function openSingleAudit(id) {
            auditMode = 'single';
            auditTargetIds = [id];
            document.getElementById('auditModalTitle').textContent = '审核';
            document.getElementById('auditModalDesc').innerHTML = '确定要审核该条补水申请吗？';
            document.getElementById('auditRemark').value = '';
            document.querySelector('input[name="auditResult"][value="approve"]').checked = true;
            document.getElementById('auditModal').classList.add('show');
        }

        // 勾选的批量审核
        function openAuditSelectedModal(type) {
            const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
            auditTargetIds = [];
            checkedBoxes.forEach(cb => {
                const tr = cb.closest('tr');
                if (tr.dataset.status === 'pending') {
                    auditTargetIds.push(tr.dataset.id);
                }
            });
            if (auditTargetIds.length === 0) {
                showToast('请选择待审核的记录', 'error');
                return;
            }
            auditMode = 'selected';
            document.getElementById('auditModalTitle').textContent = '批量审核';
            document.getElementById('auditModalDesc').innerHTML = '已选择 <span class="highlight">' + auditTargetIds.length + '</span> 条待审核记录，请选择审核结果：';
            document.getElementById('auditRemark').value = '';
            document.querySelector('input[name="auditResult"][value="' + type + '"]').checked = true;
            document.getElementById('auditModal').classList.add('show');
        }

        // 全部审核
        function openAuditAllModal(type) {
            const pendingInFiltered = filteredData.filter(i => i.status === 'pending');
            if (pendingInFiltered.length === 0) return;
            auditMode = 'all';
            auditTargetIds = pendingInFiltered.map(i => i.id);
            document.getElementById('auditModalTitle').textContent = '批量审核';
            document.getElementById('auditModalDesc').innerHTML = '当前共有 <span class="highlight">' + auditTargetIds.length + '</span> 条未审核记录，请选择审核结果：';
            document.getElementById('auditRemark').value = '';
            document.querySelector('input[name="auditResult"][value="' + type + '"]').checked = true;
            document.getElementById('auditModal').classList.add('show');
        }

        function closeAuditModal() {
            document.getElementById('auditModal').classList.remove('show');
        }

        // ========== 确认审核 ==========
        function confirmAudit() {
            const result = document.querySelector('input[name="auditResult"]:checked').value;
            const remark = document.getElementById('auditRemark').value.trim();
            const action = result === 'approve' ? '通过' : '驳回';
            const now = new Date();
            const timeStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0') + ' ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

            auditTargetIds.forEach(id => {
                const item = allData.find(i => i.id == id);
                if (item && item.status === 'pending') {
                    item.status = result;
                    item.auditTime = timeStr;
                    item.operator = '管理员';
                    item.remark = remark || '--';
                }
            });

            closeAuditModal();
            showToast('已成功' + action + ' ' + auditTargetIds.length + ' 条记录', 'success');
            filterAndRender();
        }

        // ========== Toast ==========
        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => { toast.classList.remove('show'); }, 2000);
        }

        // ========== 启动 ==========
        init();
    </script>
</body>
</html>
