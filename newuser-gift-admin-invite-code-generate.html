<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>生成邀请码 - 绿韵家管理系统</title>
<meta name="viewport" content="width=1280">
<style>
:root{
  --topbar:#2e3338; --topbar-hover:#3a3f44; --topbar-active:#f56c6c;
  --sidebar:#2e3338; --sidebar-text:#cfd3d8; --sidebar-text-dim:#8a8f95;
  --sidebar-active-bg:#f56c6c;
  --main:#f0f2f5; --card:#ffffff; --line:#e8eaed; --line-strong:#d9dbe0;
  --text:#2e3338; --text-2:#5f6368; --text-3:#9aa0a6;
  --primary:#f56c6c; --primary-hover:#f04757;
  --link:#5b6dd1; --link-hover:#3b51d1;
  --ok:#67c23a; --warn:#e6a23c;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;font-size:13px;color:var(--text);background:var(--main);overflow:hidden}

.topbar{height:50px;background:var(--topbar);color:#fff;display:flex;align-items:center;padding:0 16px}
.topbar .logo{font-size:15px;font-weight:700;margin-right:24px;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.topbar .logo::before{content:"";display:inline-block;width:18px;height:18px;background:var(--primary);border-radius:3px}
.topbar .nav{display:flex;height:100%}
.topbar .nav a{color:#cfd3d8;text-decoration:none;padding:0 18px;height:100%;display:flex;align-items:center;font-size:13px}
.topbar .nav a:hover{background:var(--topbar-hover);color:#fff}
.topbar .nav a.active{background:var(--topbar-active);color:#fff}
.topbar .user{margin-left:auto;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:#cfd3d8}
.topbar .user .avatar{width:24px;height:24px;border-radius:50%;background:#f56c6c;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}

.main{display:flex;height:calc(100% - 50px)}
.sidebar{width:200px;background:var(--sidebar);color:var(--sidebar-text);overflow-y:auto;flex-shrink:0}
.sidebar .group{padding:6px 0;border-bottom:1px solid #22272b}
.sidebar .group-title{padding:8px 16px;color:var(--sidebar-text-dim);font-size:12px}
.sidebar .menu-item{display:flex;align-items:center;gap:8px;padding:8px 16px;color:var(--sidebar-text);text-decoration:none;font-size:13px;cursor:pointer}
.sidebar .menu-item:hover{background:#3a3f44;color:#fff}
.sidebar .menu-item.active{background:var(--sidebar-active-bg);color:#fff}
.sidebar .menu-item .arrow{margin-left:auto;font-size:10px}
.icon{width:14px;height:14px;display:inline-block;background:rgba(255,255,255,.15);border-radius:2px;flex-shrink:0}

.content{flex:1;overflow-y:auto;padding:14px;background:var(--main)}
.breadcrumb{font-size:12px;color:var(--text-3);margin-bottom:10px}
.breadcrumb .sep{margin:0 4px}
.breadcrumb .cur{color:var(--text)}
.breadcrumb .back{color:var(--link);cursor:pointer;text-decoration:none}
.breadcrumb .back:hover{text-decoration:underline}

.card{background:var(--card);border-radius:4px;border:1px solid var(--line);margin-bottom:12px;max-width:760px}
.card .card-head{height:46px;padding:0 16px;display:flex;align-items:center;border-bottom:1px solid var(--line)}
.card .card-head .title{font-size:15px;font-weight:600}

.btn{height:28px;padding:0 12px;border-radius:3px;border:1px solid var(--line-strong);background:#fff;color:var(--text);font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover);color:#fff}
.btn-sm{height:24px;padding:0 8px;font-size:12px}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}

.form-body{padding:20px}
.form-item{display:flex;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.form-item:last-child{border-bottom:none}
.form-item .lbl{width:140px;color:var(--text);font-size:13px;flex-shrink:0;padding-top:6px}
.form-item .lbl .req{color:var(--primary);margin-right:2px}
.form-item .ctrl{flex:1;display:flex;flex-direction:column;gap:6px}
.hint{font-size:12px;color:var(--text-3);line-height:1.6}

.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:3px;overflow:hidden;width:fit-content}
.stepper button{width:28px;height:28px;border:none;background:#fff;cursor:pointer;font-size:15px;color:var(--text-2)}
.stepper button:hover{color:var(--primary)}
.stepper input{width:56px;height:28px;border:none;border-left:1px solid var(--line-strong);border-right:1px solid var(--line-strong);text-align:center;font-size:13px;outline:none}
.input,textarea{width:100%;padding:8px;border:1px solid var(--line-strong);border-radius:3px;font-size:13px;outline:none;background:#fff;font-family:inherit;resize:vertical}
.input:focus,textarea:focus{border-color:var(--primary)}

.form-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px;border-top:1px solid var(--line)}

.tag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;line-height:16px}
.tag.src-system{background:#f0f2f5;color:var(--text-2);border:1px solid var(--line-strong)}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">绿韵家管理系统</div>
  <div class="nav">
    <a href="#" class="active">店铺</a>
    <a href="#">营销中心</a>
    <a href="#">运营中心</a>
  </div>
  <div class="user">
    <div class="avatar">袁</div>
    <span>袁X ▾</span>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <div class="group">
      <div class="group-title">店铺</div>
      <div class="menu-item"><span class="icon"></span>店铺总览<span class="arrow">▾</span></div>
    </div>
    <div class="group">
      <div class="group-title">商品中心</div>
      <div class="menu-item"><span class="icon"></span>商品分类<span class="arrow">▾</span></div>
      <div class="menu-item"><span class="icon"></span>商品管理<span class="arrow">▾</span></div>
      <div class="menu-item"><span class="icon"></span>商品评价<span class="arrow">▾</span></div>
      <div class="menu-item active"><span class="icon"></span>邀请码管理</div>
      <div class="menu-item"><span class="icon"></span>商品上架审核<span class="arrow">▾</span></div>
      <div class="menu-item"><span class="icon"></span>品牌管理<span class="arrow">▾</span></div>
    </div>
    <div class="group"><div class="group-title">营销中心</div><div class="menu-item"><span class="icon"></span>营销中心<span class="arrow">▾</span></div></div>
    <div class="group"><div class="group-title">订单中心</div><div class="menu-item"><span class="icon"></span>订单管理<span class="arrow">▾</span></div></div>
    <div class="group"><div class="group-title">会员中心</div><div class="menu-item"><span class="icon"></span>会员中心<span class="arrow">▾</span></div></div>
    <div class="group"><div class="group-title">数据中心</div><div class="menu-item"><span class="icon"></span>数据中心<span class="arrow">▾</span></div></div>
  </div>

  <div class="content">
    <div class="breadcrumb">
      <a class="back" onclick="goBack()">← 返回邀请码管理</a>
      <span class="sep" style="margin-left:12px">/</span>
      <span>店铺</span><span class="sep">/</span><span>商品中心</span><span class="sep">/</span><span>邀请码管理</span><span class="sep">/</span><span class="cur">生成邀请码</span>
    </div>

    <div class="card">
      <div class="card-head"><div class="title">后台生成邀请码</div></div>
      <div class="form-body">
        <div class="form-item">
          <div class="lbl"><span class="req">*</span>生成途径</div>
          <div class="ctrl">
            <span class="tag src-system">系统生成</span>
            <div class="hint">后台手动新增的邀请码统一标记为「系统生成」，与会员购买生成的「购买生成」区分。</div>
          </div>
        </div>
        <div class="form-item">
          <div class="lbl"><span class="req">*</span>生成数量</div>
          <div class="ctrl">
            <div class="stepper">
              <button type="button" onclick="step(-1)">−</button>
              <input id="gen_count" value="1" readonly>
              <button type="button" onclick="step(1)">+</button>
            </div>
            <div class="hint">默认 1，最小 1，最大 99。每个邀请码随机生成，含特殊符号大小写，长度 ≥ 8。</div>
          </div>
        </div>
        <div class="form-item">
          <div class="lbl">备注</div>
          <div class="ctrl">
            <textarea id="gen_remark" rows="3" placeholder="选填，记录本次生成用途（如：线下活动赠码 / 地推补发）"></textarea>
          </div>
        </div>
      </div>
      <div class="form-foot">
        <button class="btn" onclick="goBack()">取消</button>
        <button class="btn btn-primary" onclick="submitGen()">确认生成</button>
      </div>
    </div>
  </div>
</div>

<script>
function step(d){
  var el = document.getElementById('gen_count');
  var v = Math.max(1, Math.min(99, (parseInt(el.value,10)||1) + d));
  el.value = v;
}
function goBack(){ history.back(); }
function submitGen(){
  var n = parseInt(document.getElementById('gen_count').value,10) || 1;
  var remark = document.getElementById('gen_remark').value.trim();
  // 原型演示：实际写库逻辑由后端实现；提交后直接跳转到列表页查看
  window.location.href = 'admin-invite-codes.html?generated=' + n + (remark ? '&remark=' + encodeURI(remark) : '');
}
</script>
</body>
</html>
