<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>绿韵家 App · 登录注册（正式版）</title>
<link rel="stylesheet" href="lvyun-app-design-base.css">
<style>
  /* ============ 原型层（结构布局，不用硬编码颜色/字号，全走 base 变量） ============ */
  body{font-family:var(--lv-font);background:var(--lv-bg-grey-2);margin:0;padding:20px;color:var(--lv-text-2)}
  .meta{font-size:13px;color:var(--lv-text-3);margin:0 0 16px;max-width:720px;line-height:1.6}
  .meta code{background:var(--lv-bg-grey);padding:1px 6px;border-radius:var(--lv-radius-sm);font-family:Menlo,Consolas,monospace;font-size:12px;color:var(--lv-text-1)}
  .stage{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
  .frame{
    width:375px;min-height:812px;
    border:1px solid var(--lv-divider);border-radius:32px;overflow:hidden;
    background:var(--lv-bg);
    box-shadow:0 6px 24px rgba(0,0,0,.06);
    position:relative;
  }
  .status-bar{
    height:44px;display:flex;justify-content:space-between;align-items:center;
    padding:0 24px;font-size:14px;font-weight:600;color:var(--lv-text-1);
  }
  .brand{padding:32px 24px 8px}
  .brand h1{font-size:32px;font-weight:var(--lv-fw-bold);color:var(--lv-text-1);margin:0;letter-spacing:.5px}
  .brand p{font-size:14px;color:var(--lv-text-3);margin:8px 0 0}
  .login-card{margin:16px 24px 0;padding:8px 0 0}
  .field{padding:16px 0;border-bottom:1px solid var(--lv-divider)}
  .field:last-of-type{border-bottom:0}
  .field-label{font-size:13px;color:var(--lv-text-3);margin-bottom:8px}
  .field-row{display:flex;align-items:center;gap:10px}
  .field-row .prefix{
    color:var(--lv-text-1);font-weight:var(--lv-fw-medium);padding-right:10px;
    border-right:1px solid var(--lv-divider);font-family:var(--lv-font-num);
  }
  .field-row input{
    flex:1;border:0;outline:0;background:transparent;
    font-family:var(--lv-font);font-size:16px;color:var(--lv-text-1);
    padding:6px 0;min-width:0;
  }
  .field-row input::placeholder{color:var(--lv-text-4)}
  .code-row{display:flex;align-items:center;gap:8px}
  .code-row input{
    flex:1;border:0;outline:0;background:transparent;
    font-family:var(--lv-font-num);font-size:18px;letter-spacing:2px;
    color:var(--lv-text-1);padding:6px 0;min-width:0;
  }
  .code-row input::placeholder{color:var(--lv-text-4);letter-spacing:0}
  .get-code{
    border:0;background:transparent;color:var(--lv-primary);
    font-size:14px;font-weight:var(--lv-fw-medium);cursor:pointer;
    padding:6px 0;white-space:nowrap;font-family:var(--lv-font);
  }
  .get-code:disabled{color:var(--lv-text-disabled);cursor:not-allowed}
  .agree{
    margin:24px 24px 16px;font-size:13px;color:var(--lv-text-3);
    display:flex;align-items:flex-start;gap:8px;line-height:1.6;
  }
  .agree input[type="checkbox"]{
    appearance:none;-webkit-appearance:none;
    width:16px;height:16px;border-radius:3px;
    border:1px solid var(--lv-divider-strong);background:var(--lv-bg);
    cursor:pointer;margin-top:3px;flex-shrink:0;
    position:relative;transition:background .15s,border-color .15s;
  }
  .agree input[type="checkbox"]:checked{
    background:var(--lv-primary);border-color:var(--lv-primary);
  }
  .agree input[type="checkbox"]:checked::after{
    content:"";position:absolute;left:4px;top:1px;
    width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }
  .agree a{color:var(--lv-primary);text-decoration:none}
  .agree a:hover{text-decoration:underline}
  .login-btn{margin:0 24px 24px;width:calc(100% - 48px)}

  /* ============ 首页占位（登录后到达） ============ */
  .home-stub{padding:48px 24px}
  .home-stub h2{font-size:24px;font-weight:var(--lv-fw-bold);color:var(--lv-text-1);margin:0 0 8px}
  .home-stub p{font-size:14px;color:var(--lv-text-3);margin:0 0 32px}
  .logout-btn{
    width:100%;padding:12px 0;border-radius:var(--lv-radius-pill);
    background:var(--lv-bg-grey);color:var(--lv-text-1);
    border:0;font-size:14px;font-weight:var(--lv-fw-medium);cursor:pointer;
    font-family:var(--lv-font);
  }
  .logout-btn:hover{background:var(--lv-bg-grey-2)}

  /* ============ 全局 Toast（PROTO-STY-006 复用） ============ */
  .toast{
    position:fixed;left:50%;bottom:80px;transform:translateX(-50%);
    background:rgba(0,0,0,.78);color:#fff;
    padding:10px 18px;border-radius:var(--lv-radius-pill);
    font-size:13px;z-index:999;
    opacity:0;pointer-events:none;transition:opacity .2s;
    max-width:80%;text-align:center;
  }
  .toast.show{opacity:1}

  /* ============ pages 切换 ============ */
  .page{display:none}
  .page.active{display:block}
</style>
</head>
<body>

<p class="meta">
  绿韵家 App「登录注册」<b>正式版</b> — 套设计基准 <code>kb/design-spec/lvyun-app-design-base.css</code>（App 板块唯一设计基准）。
  本期范围：仅「手机号+验证码登录」（首次=自动注册），不做密码登录 / 忘记密码；协议正文由后台控制台「协议文档」下发。
</p>

<div class="stage">

  <div class="frame">

    <!-- ============ 登录页 ============ -->
    <section id="page-login" class="page active">
      <div class="status-bar"><span>9:41</span><span>●●●●● 5G</span></div>
      <div class="brand">
        <h1>Hello!</h1>
        <p>欢迎来到绿韵家</p>
      </div>
      <div class="login-card">
        <div class="field">
          <div class="field-label">手机号</div>
          <div class="field-row">
            <span class="prefix">+86</span>
            <input id="phone" type="tel" inputmode="numeric" maxlength="11" placeholder="请输入手机号码" autocomplete="tel">
          </div>
        </div>
        <div class="field">
          <div class="field-label">验证码</div>
          <div class="code-row">
            <input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="请输入验证码">
            <button id="getcode" class="get-code" type="button">获取验证码</button>
          </div>
        </div>
      </div>
      <div class="agree">
        <input id="agree" type="checkbox">
        <label for="agree">已阅读并同意 <a href="#" id="link-user">《用户协议》</a> <a href="#" id="link-priv">《隐私政策》</a></label>
      </div>
      <button id="login" class="lv-btn-primary login-btn" type="button">登录</button>
    </section>

    <!-- ============ 首页占位（登录成功后到达） ============ -->
    <section id="page-home" class="page">
      <div class="status-bar"><span>9:41</span><span>●●●●● 5G</span></div>
      <div class="home-stub">
        <h2>绿韵家</h2>
        <p>登录成功 · 首页占位（待设计稿）</p>
        <button id="logout" class="logout-btn" type="button">退出登录</button>
      </div>
    </section>

  </div>

</div>

<div id="toast" class="toast"></div>

<script>
  /* ============ 全局 Toast ============ */
  function showToast(msg, ms) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(function(){ t.classList.remove('show'); }, ms || 1800);
  }
  /* ============ page 切换 ============ */
  function go(id) {
    document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
    var target = document.getElementById(id);
    if (target) target.classList.add('active');
  }

  /* ============ 元素 ============ */
  var phone   = document.getElementById('phone');
  var codeEl  = document.getElementById('code');
  var agree   = document.getElementById('agree');
  var getBtn  = document.getElementById('getcode');
  var loginBtn = document.getElementById('login');
  var logoutBtn = document.getElementById('logout');

  /* ============ 获取验证码（60s 倒计时 + 手机号校验） ============ */
  var cdTimer = null;
  function resetCd() {
    if (cdTimer) { clearInterval(cdTimer); cdTimer = null; }
    getBtn.disabled = false;
    getBtn.textContent = '获取验证码';
  }
  function startCd() {
    getBtn.disabled = true;
    var left = 60;
    getBtn.textContent = left + 's 后重发';
    cdTimer = setInterval(function() {
      left -= 1;
      if (left <= 0) { resetCd(); return; }
      getBtn.textContent = left + 's 后重发';
    }, 1000);
  }
  getBtn.addEventListener('click', function() {
    if (getBtn.disabled) return;
    var p = phone.value.trim();
    if (!/^1[3-9]\d{9}$/.test(p)) { showToast('请输入正确的手机号'); return; }
    startCd();
    showToast('验证码已发送');
  });

  /* ============ 登录（校验协议 + 手机号 + 验证码） ============ */
  loginBtn.addEventListener('click', function() {
    if (!agree.checked) { showToast('请先阅读并同意用户协议与隐私政策'); return; }
    var p = phone.value.trim();
    var c = codeEl.value.trim();
    if (!/^1[3-9]\d{9}$/.test(p)) { showToast('请输入正确的手机号'); return; }
    if (!/^\d{6}$/.test(c)) { showToast('请输入 6 位验证码'); return; }
    showToast('登录成功');
    setTimeout(function() { go('page-home'); }, 500);
  });

  /* ============ 协议链接（PRD：正文由后台下发） ============ */
  document.getElementById('link-user').addEventListener('click', function(e) {
    e.preventDefault(); showToast('用户协议由后台控制台「协议文档」下发');
  });
  document.getElementById('link-priv').addEventListener('click', function(e) {
    e.preventDefault(); showToast('隐私政策由后台控制台「协议文档」下发');
  });

  /* ============ 退出登录（回登录页 + 重置状态） ============ */
  logoutBtn.addEventListener('click', function() {
    phone.value = '';
    codeEl.value = '';
    agree.checked = false;
    resetCd();
    go('page-login');
    showToast('已退出登录');
  });
</script>

</body>
</html>
